name: Update Contribution Skyline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/contribution_skyline.py
      - .github/workflows/contribution-skyline.yml

permissions:
  contents: write

concurrency:
  group: contribution-skyline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch real contributions and render skyline
        run: python scripts/contribution_skyline.py --username Uttkarshchambiyal
      - name: Publish changed skyline
        run: |
          git add assets/contribution-skyline.svg
          if git diff --cached --quiet; then
            echo "Contribution skyline is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contribution skyline"
          git pull --rebase origin main
          git push origin HEAD:main
