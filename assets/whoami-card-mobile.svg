<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 480 1360" role="img" aria-labelledby="title description">
<title id="title">About Uttkarsh Chambiyal</title>
<desc id="description">Uttkarsh Chambiyal, B.Tech CSE student, semester 3, based in Bengaluru, Karnataka, India. Focus: frontend development, data structures and algorithms, competitive programming, and UI/UX design with Figma. Currently learning React, Node.js, MongoDB, Spring Boot and SwiftUI; also exploring system design and AI/ML. Tools: Claude, Codex, IntelliJ IDEA, PyCharm and DataGrip. Open to internships, hackathons, freelance projects and open source. Hobbies: coding, video editing, Formula 1 and hackathons. The focus panel rotates automatically.</desc>
